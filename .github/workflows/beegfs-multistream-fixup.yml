name: BeeGFS branch fixup

on:
  push:
    branches:
      - feat/beegfs-multistream

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beegfs-multistream
          fetch-depth: 0
      - name: Apply focused BeeGFS fixes
        shell: python
        run: |
          from pathlib import Path

          session_path = Path('Hawkynt.FileFormats.FileSystems/FileSystems/FileSystem.BeeGfs/BeeGfsReadOnlyFilesystemSession.cs')
          text = session_path.read_text(encoding='utf-8')
          old = '''    if (!_leaveOpen)\n      foreach (var stream in _sources.Select(source => source.Stream).Distinct(ReferenceEqualityComparer.Instance))\n        stream.Dispose();'''
          new = '''    if (!_leaveOpen) {\n      var disposed = new HashSet<Stream>(ReferenceEqualityComparer.Instance);\n      foreach (var source in _sources)\n        if (disposed.Add(source.Stream))\n          source.Stream.Dispose();\n    }'''
          if old not in text:
            raise SystemExit('expected stream-disposal block not found')
          text = text.replace(old, new, 1)

          old = '''    foreach (var (contentEntryId, _) in contentOwners)\n      if (contentEntryId != RootEntryId && !nodesByEntryId.TryGetValue(contentEntryId, out var node))\n        throw new InvalidDataException(\n          $"BeeGFS metadata contains an orphan content directory for unknown EntryID '{contentEntryId}'.");\n      else if (contentEntryId != RootEntryId && node.Kind != FilesystemNodeKind.Directory)\n        throw new InvalidDataException(\n          $"BeeGFS content directory EntryID '{contentEntryId}' resolves to non-directory kind {node.Kind}.");'''
          new = '''    foreach (var contentEntryId in contentOwners.Keys) {\n      if (contentEntryId == RootEntryId) continue;\n      if (!nodesByEntryId.TryGetValue(contentEntryId, out var node))\n        throw new InvalidDataException(\n          $"BeeGFS metadata contains an orphan content directory for unknown EntryID '{contentEntryId}'.");\n      if (node.Kind != FilesystemNodeKind.Directory)\n        throw new InvalidDataException(\n          $"BeeGFS content directory EntryID '{contentEntryId}' resolves to non-directory kind {node.Kind}.");\n    }'''
          if old not in text:
            raise SystemExit('expected content-owner validation block not found')
          session_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          codec_path = Path('Hawkynt.FileFormats.FileSystems/FileSystems/FileSystem.BeeGfs/BeeGfsMetadataCodec.cs')
          text = codec_path.read_text(encoding='utf-8')
          old = '''    if ((dentryFeatures & ~SupportedDentryFeatures) != 0)\n      throw new NotSupportedException($"BeeGFS dentry uses unknown feature flags 0x{dentryFeatures:X4}.");\n\n    var kind = KindFor(reader.ReadByte());'''
          new = '''    if ((dentryFeatures & ~SupportedDentryFeatures) != 0)\n      throw new NotSupportedException($"BeeGFS dentry uses unknown feature flags 0x{dentryFeatures:X4}.");\n    if ((dentryFeatures & (DentryFeatureMirrored | DentryFeatureBuddyMirrored)) != 0)\n      throw new NotSupportedException(\n        "BeeGFS mirrored dentry metadata requires management/buddy-group mapping and is outside the current read-only subset.");\n\n    var kind = KindFor(reader.ReadByte());'''
          if old not in text:
            raise SystemExit('expected dentry feature validation block not found')
          codec_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('Compression.Tests/BeeGfs/BeeGfsMetadataCodecTests.cs')
          text = test_path.read_text(encoding='utf-8')
          marker = '''  [Test, Category("Exception")]\n  public void SparseV6File_FailsClosedBeforeVariableBlockVector() {'''
          addition = '''  [TestCase((ushort)4)]\n  [TestCase((ushort)8)]\n  [Category("Exception")]\n  public void MirroredDentry_FailsClosed(ushort mirroredFlag) {\n    var bytes = BuildV3Directory("0-67059D13-1", ownerNodeId: 7, dentryFlags: (ushort)(16 | mirroredFlag));\n\n    var error = Assert.Throws<NotSupportedException>(() =>\n      BeeGfsMetadataCodec.ParseDentry(bytes, "root"));\n\n    Assert.That(error!.Message, Does.Contain("mirrored dentry"));\n  }\n\n'''
          if marker not in text:
            raise SystemExit('expected test insertion marker not found')
          text = text.replace(marker, addition + marker, 1)
          old = '''  private static byte[] BuildV3Directory(string entryId, uint ownerNodeId) {'''
          new = '''  private static byte[] BuildV3Directory(string entryId, uint ownerNodeId, ushort dentryFlags = 16) {'''
          if old not in text:
            raise SystemExit('expected V3 fixture signature not found')
          text = text.replace(old, new, 1)
          old = '''    writer.Write((ushort)16); // DENTRY_FEATURE_32BITIDS'''
          new = '''    writer.Write(dentryFlags); // DENTRY_FEATURE_*'''
          if old not in text:
            raise SystemExit('expected V3 fixture flags write not found')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Hawkynt.FileFormats.FileSystems/FileSystems/FileSystem.BeeGfs/BeeGfsReadOnlyFilesystemSession.cs \
            Hawkynt.FileFormats.FileSystems/FileSystems/FileSystem.BeeGfs/BeeGfsMetadataCodec.cs \
            Compression.Tests/BeeGfs/BeeGfsMetadataCodecTests.cs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '+ fix BeeGFS multistream compile gates'
          git push origin HEAD:feat/beegfs-multistream
