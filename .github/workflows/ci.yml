name: CI

on:
  pull_request:
    branches: [main, master]
  # release.yml calls this via `uses: ./.github/workflows/ci.yml` so tag
  # releases run the exact same test matrix as per-PR CI.
  workflow_call: {}
  workflow_dispatch: {}

# Pushing three times to a branch used to queue three full matrices and run all of them. A newer
# pull-request run supersedes the older one; a push to main is not cancelled, because main wants a
# recorded result for every commit rather than only for the newest.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # The SFX stubs are NativeAOT and build one runner per OS, so they are expensive. Only a pull
  # request that touches their code pays for them — but that one must, because otherwise the Linux
  # and macOS stubs would first run in the nightly after the change had already landed.
  sfx-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(Compression\.Sfx\.|Compression\.Lib/Sfx|Compression\.Registry/(SfxTrailer|SubStream|CompoundTarDescriptor)|\.github/workflows/(_sfx-stubs\.yml|scripts/sfx-smoke\.py))'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  sfx-stubs:
    needs: sfx-changes
    if: needs.sfx-changes.outputs.touched == 'true'
    uses: ./.github/workflows/_sfx-stubs.yml
    with:
      # The universal stub plus one carved archive and one carved compound tar: every code path the
      # full release matrix exercises, at a sixth of its cost.
      tiers: '["Universal","Zip","TarGz"]'
      upload: false

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # The Linux leg runs on 24.04: later Ubuntu images no longer ship bcachefs-tools or
    # reiser4progs, and one missing package fails the whole oracle install. The job keeps the
    # name "ubuntu-latest" so the required checks and the matrix conditions below still match.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                          # version.pl needs full history
      - uses: ./.github/actions/nativeforms-source

      # FileFormat.PngCrushAdapters has sibling-conditional ProjectReferences
      # to ..\..\PNGCrushCS\FileFormat.{Png,Apng,Jpeg,...}. Without the sibling
      # those types disappear and any test that imports them fails to compile.
      # Clone the sibling alongside CompressionWorkbench so the conditional
      # resolves to true and the full image-format surface is available on CI.
      - name: Clone PNGCrushCS sibling
        shell: bash
        run: git clone --depth 1 https://github.com/Hawkynt/PNGCrushCS.git "$GITHUB_WORKSPACE/../PNGCrushCS"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # MSBuild does not reliably propagate $(Configuration) across solution-tree
      # boundaries; without this pre-build the sibling builds to bin/Debug/net8.0/
      # and the publish step then can't find Release/net8.0/ during bundling.
      - name: Pre-build PNGCrushCS sibling (Release)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/../PNGCrushCS"
          REQUIRED="Compression.Core FileFormat.Core FileFormat.Bmp FileFormat.Apng \
                    FileFormat.Tiff FileFormat.BigTiff FileFormat.Mng FileFormat.Fli \
                    FileFormat.Dcx FileFormat.Icns FileFormat.Mpo FileFormat.Jpeg \
                    FileFormat.Png"
          # Sibling reorganised most format projects into a FileFormats/ subdir
          # but kept Compression.Core / FileFormat.Core at the root. Probe both
          # locations per project so the script tolerates the layout move; also
          # tolerate transient sibling-mid-refactor commits where a project is
          # missing entirely — FileFormat.PngCrushAdapters.csproj has a matching
          # SiblingPresent gate that falls back to an empty assembly.
          locate() {
            local proj="$1"
            if [ -f "$proj/$proj.csproj" ]; then echo "$proj"; return 0; fi
            if [ -f "FileFormats/$proj/$proj.csproj" ]; then echo "FileFormats/$proj"; return 0; fi
            return 1
          }
          MISSING=""
          for proj in $REQUIRED; do
            if ! locate "$proj" >/dev/null; then
              MISSING="$MISSING $proj"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::PNGCrushCS sibling incomplete (missing:$MISSING). Skipping pre-build; consumer csproj SiblingPresent gate handles the fallback."
            exit 0
          fi
          for proj in $REQUIRED; do
            dir="$(locate "$proj")"
            echo "::group::Building $proj ($dir)"
            dotnet build "$dir/$proj.csproj" --configuration Release --nologo
            echo "::endgroup::"
            test -f "$dir/bin/Release/net8.0/$proj.dll" || {
              echo "::error::Pre-build did not produce $dir/bin/Release/net8.0/$proj.dll"
              exit 1
            }
          done
          echo "All sibling Release DLLs verified."

      - name: Restore
        run: dotnet restore CompressionWorkbench.slnx

      - name: Build
        run: dotnet build CompressionWorkbench.slnx --configuration Release --no-restore

      # Verify the four NuGet meta-packages still pack on every PR / push.
      # This catches regressions in the bundling target (filter excludes for
      # Compression.Core / Registry, ProjectReference path resolution, etc.)
      # before they reach release / nightly. We don't push or upload — the
      # _build.yml workflow does the real packing and artifact upload for the
      # nightly / release workflows that consume them.
      #
      # NB: --no-build is intentionally omitted. The meta csprojs use a custom
      # `_AddBundledAssembliesToPackage` target with `DependsOnTargets="ResolveReferences"`
      # which the SDK refuses to invoke under --no-build (NETSDK1085). The
      # prior `dotnet build` step already produced up-to-date outputs so pack's
      # build phase no-ops.
      - name: Verify NuGet meta-packages pack
        if: matrix.os == 'ubuntu-latest'
        run: |
          rm -rf dist-nuget
          dotnet pack Compression.Core/Hawkynt.Compression.Core.csproj                 --configuration Release --output dist-nuget -p:Version=0.0.0-ci
          dotnet pack Hawkynt.FileFormats.Audio/Hawkynt.FileFormats.Audio.csproj             --configuration Release --output dist-nuget -p:Version=0.0.0-ci
          dotnet pack Hawkynt.FileFormats.Archives/Hawkynt.FileFormats.Archives.csproj       --configuration Release --output dist-nuget -p:Version=0.0.0-ci
          dotnet pack Hawkynt.FileFormats.FileSystems/Hawkynt.FileFormats.FileSystems.csproj --configuration Release --output dist-nuget -p:Version=0.0.0-ci
          ls -la dist-nuget/

      - name: Install interop tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full gzip bzip2 xz-utils zstd lz4 tar cpio genisoimage mtools qemu-utils gfs2-utils bcachefs-tools xfsprogs
          # cabextract and wimlib-imagex are the tools that OWN the CAB and WIM formats.
          # Both reference tests fall back to 7-Zip when they are absent, so without these
          # two packages the owning readers were never asked -- which is what #85 and #86
          # each reported. Installed so those cases run instead of silently degrading.
          sudo apt-get install -y cabextract wimtools
          # dar owns the DAR format: the DAR writer only advertises CanCreate because dar -t and
          # dar -x accept what it writes, which the gate below checks on every run.
          sudo apt-get install -y dar
          # reiser4progs owns Reiser4: fsck.reiser4 and debugfs.reiser4 judge every volume the
          # Reiser4 writer creates or edits, in the gate below.
          sudo apt-get install -y reiser4progs
          # zpaq (7.15) owns ZPAQ: it must list and extract what the ZPAQ writer produces, and the
          # reader must decode every method zpaq writes, in the gate below.
          sudo apt-get install -y zpaq
          # mkbootimg is AOSP's own boot image tool pair: the Android boot image writer must
          # reproduce mkbootimg's bytes, and unpack_bootimg must read back what it writes.
          sudo apt-get install -y mkbootimg
          # avbtool judges vbmeta images; no distribution packages it, so the script is fetched
          # at a pinned AOSP revision.
          curl -sSfL "https://android.googlesource.com/platform/external/avb/+/c5066a96caa7bf4150c0a8cc8cc14ab81733fdc7/avbtool.py?format=TEXT" \
            | base64 -d > "$RUNNER_TEMP/avbtool.py" \
            && echo "CWB_AVBTOOL=$RUNNER_TEMP/avbtool.py" >> "$GITHUB_ENV" || true
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe gfs2 || true

      # Core tests -- always run (no external tools required).
      #
      # NOTE the two similar category names, which are NOT spellings of each other:
      #   End2End    (95 uses) in-process create/extract round trips - Ace, Arj, Arc and friends.
      #              No external process, so it belongs here and GATES the pull request.
      #   EndToEnd   (10 uses) oracle comparisons against real 7-Zip / RAR / SFX binaries. Needs
      #              the tools installed below, hence its own advisory step.
      # Renaming one to the other would move 95 gating tests into an advisory tier that installs
      # tools they never use. Leave them distinct.
      - name: Core tests
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "TestCategory!=EndToEnd&TestCategory!=OsIntegration&TestCategory!=ExternalInterop&TestCategory!=ExternalFsInterop&TestCategory!=PolyglotInterop&TestCategory!=Performance"
          --logger "trx;LogFileName=core-tests.trx"

      # Interop tools for E2E tests. gfs2-utils is a mandatory oracle for the
      # ExHash gate below; linux-modules-extra supplies gfs2.ko on Ubuntu runner
      # kernels where it is not built in.
      - name: Install 7-Zip (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install 7zip -y

      # Unlike the broad external tier below, this is a hard gate: real
      # fsck.gfs2 must accept our ExHash metadata and the Linux driver must mount
      # the image and resolve/read the emitted namespace.
      - name: GFS2 ExHash oracle
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "FullyQualifiedName~Compression.Tests.Gfs2.Gfs2NestedDirectoryExternalTests"
          --logger "trx;LogFileName=gfs2-exhash-tests.trx"

      # Hard gate, both directions: dar must accept and restore byte for byte what the DAR writer
      # produces, and the reader must restore what dar writes (every compression, slices, tape
      # marks). Without this the writer's CanCreate would rest on our reader agreeing with itself.
      - name: DAR oracle
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "FullyQualifiedName~Compression.Tests.Dar.DarExternalConformanceTests"
          --logger "trx;LogFileName=dar-oracle-tests.trx"

      # Hard gate: reiser4progs judges what the Reiser4 writer creates and edits. fsck.reiser4
      # --check must call every volume consistent, debugfs.reiser4 must resolve each path to the
      # bytes we wrote, and volumes mkfs.reiser4 made are edited without losing their identity.
      - name: Reiser4 oracle
        if: matrix.os == 'ubuntu-latest'
        env:
          CWB_REQUIRE_REISER4PROGS: "1"
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "FullyQualifiedName~Compression.Tests.Reiser4.Reiser4ProfileExternalTests|FullyQualifiedName~Compression.Tests.Reiser4.Reiser4MutationExternalTests|FullyQualifiedName~Compression.Tests.Reiser4.Reiser4NativeTreeExternalTests|FullyQualifiedName~Compression.Tests.Reiser4.Reiser4FeatureExternalTests"
          --logger "trx;LogFileName=reiser4-oracle-tests.trx"

      # The kernel that judges bcachefs runs in the libguestfs appliance: 24.04's
      # generic 6.8 kernel carries bcachefs as a module, the runner's own Azure
      # kernel need not. supermin is pointed at it so the appliance does not boot
      # the newest kernel in /boot.
      - name: Install a kernel with bcachefs (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get install -y libguestfs-tools
          kver=$(apt-cache depends linux-image-generic | sed -n 's/^ *Depends: linux-image-\(.*-generic\)$/\1/p' | head -n 1)
          test -n "$kver" || { echo "::error::cannot resolve the generic kernel version"; exit 1; }
          sudo apt-get install -y --no-install-recommends "linux-image-$kver" "linux-modules-$kver" "linux-modules-extra-$kver"
          sudo chmod 0644 /boot/vmlinuz-*
          sudo chmod 0666 /dev/kvm || echo "::warning::no /dev/kvm; the appliance runs without acceleration"
          echo "SUPERMIN_KERNEL=/boot/vmlinuz-$kver" >> "$GITHUB_ENV"
          echo "SUPERMIN_MODULES=/lib/modules/$kver" >> "$GITHUB_ENV"
          echo "SUPERMIN_KERNEL_VERSION=$kver" >> "$GITHUB_ENV"
          find "/lib/modules/$kver" -name 'bcachefs.ko*' | grep -q . \
            || { echo "::error::linux-modules(-extra)-$kver has no bcachefs module"; exit 1; }

      # Hard gate, both directions: the reference ECM tool must restore what the ECM encoder
      # writes, and our decoder must restore what it writes. No distribution packages it, so it is
      # built from the pinned upstream revision (GPL-3.0; used as a black box, never shipped).
      - name: ECM oracle
        if: matrix.os == 'ubuntu-latest'
        env:
          CWB_REQUIRE_ECM: "1"
        run: |
          git clone --quiet https://github.com/alucryd/ecm-tools "$RUNNER_TEMP/ecm-tools"
          git -C "$RUNNER_TEMP/ecm-tools" checkout --quiet 2765930b79fff478a6a584a554c719b8bf041422
          gcc -O2 -o "$RUNNER_TEMP/ecm-tools/bin2ecm" "$RUNNER_TEMP/ecm-tools/ecm.c"
          sudo install -m 755 "$RUNNER_TEMP/ecm-tools/bin2ecm" /usr/local/bin/bin2ecm
          sudo ln -sf bin2ecm /usr/local/bin/ecm2bin
          dotnet test Compression.Tests --configuration Release --no-build \
            --filter "FullyQualifiedName~Compression.Tests.Ecm.EcmExternalConformanceTests" \
            --logger "trx;LogFileName=ecm-oracle-tests.trx"

      # Hard gate, both directions: PowerISO for Linux (freeware, checksum-pinned, used as a black
      # box) converts our DAA images back to identical ISOs, and we read the DAA images it writes.
      - name: DAA oracle
        if: matrix.os == 'ubuntu-latest'
        env:
          CWB_REQUIRE_POWERISO: "1"
        run: |
          curl -sfL -o "$RUNNER_TEMP/poweriso.tgz" https://www.poweriso.com/poweriso-1.3.tar.gz
          echo "605ae3fceb93952422b42d868f1317d1c6d48d2bdbaee700dcf17e99dbe65fc0  $RUNNER_TEMP/poweriso.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/poweriso.tgz" -C "$RUNNER_TEMP"
          CWB_POWERISO="$RUNNER_TEMP/poweriso" dotnet test Compression.Tests --configuration Release --no-build \
            --filter "FullyQualifiedName~Compression.Tests.Daa.DaaExternalConformanceTests" \
            --logger "trx;LogFileName=daa-oracle-tests.trx"

      # Hard gate, both directions: zpaq must list and extract byte for byte what the ZPAQ writer
      # produces (every method), the reader must decode what zpaq writes (every method, versions,
      # deduplication, streaming), and our compressed data blocks must equal zpaq 7.15's.
      - name: ZPAQ oracle
        if: matrix.os == 'ubuntu-latest'
        env:
          CWB_REQUIRE_ZPAQ: "1"
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "FullyQualifiedName~Compression.Tests.Zpaq.ZpaqExternalOracleTests"
          --logger "trx;LogFileName=zpaq-oracle-tests.trx"

      # The DAR oracle again, judged by the newest dar release built from its source tarball (Ubuntu
      # only packages 2.7). The build is cached; when SourceForge cannot be reached and nothing is
      # cached the step says so and skips, but a dar that runs and refuses fails it.
      - name: Cache dar 2.8.6
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: /opt/cwb-dar/2.8.6
          key: dar-2.8.6-${{ runner.os }}-v1
      - name: DAR oracle (dar 2.8.6)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ ! -x /opt/cwb-dar/2.8.6/bin/dar ]; then
            sudo apt-get install -y libz-dev libbz2-dev liblzo2-dev liblzma-dev libzstd-dev liblz4-dev
            sudo mkdir -p /opt/cwb-dar && sudo chown "$(id -u)" /opt/cwb-dar
            if ! curl -fsSL -o /tmp/dar-2.8.6.tar.gz "https://sourceforge.net/projects/dar/files/dar/2.8.6/dar-2.8.6.tar.gz/download"; then
              echo "::notice::dar 2.8.6 source unavailable and not cached; skipping the 2.8.6 oracle"
              exit 0
            fi
            echo "d56caeb6c86f751cb454d8fef45f3daecc508f208290d9f51e8c75bba5dc46c5  /tmp/dar-2.8.6.tar.gz" | sha256sum -c -
            tar xzf /tmp/dar-2.8.6.tar.gz -C /tmp
            (cd /tmp/dar-2.8.6 && ./configure --prefix=/opt/cwb-dar/2.8.6 --disable-shared --disable-dar-static \
              --disable-python-binding --disable-gpgme-linking --disable-libcurl-linking --disable-librsync-linking \
              --disable-libargon2-linking --disable-threadar --disable-upx --disable-build-html --disable-libgcrypt-linking \
              > /dev/null && make -j"$(nproc)" > /dev/null && make install > /dev/null)
          fi
          /opt/cwb-dar/2.8.6/bin/dar -V 2>&1 | head -1 || true
          CWB_DAR=/opt/cwb-dar/2.8.6/bin/dar dotnet test Compression.Tests --configuration Release --no-build \
            --filter "FullyQualifiedName~Compression.Tests.Dar.DarExternalConformanceTests" \
            --logger "trx;LogFileName=dar-286-oracle-tests.trx"

      # Hard gate: MAME floptool turns a 140K DOS-order image into WOZ, we rebuild a WOZ 2 from the
      # parts we list (and edit one track), and floptool decodes our result to the expected sectors.
      - name: WOZ oracle
        if: matrix.os == 'ubuntu-latest'
        env:
          CWB_REQUIRE_FLOPTOOL: "1"
        run: |
          sudo apt-get install -y mame-tools
          dotnet test Compression.Tests --configuration Release --no-build \
            --filter "FullyQualifiedName~Compression.Tests.Woz.WozExternalConformanceTests" \
            --logger "trx;LogFileName=woz-oracle-tests.trx"

      # bcachefs-tools' own checker judges every volume this package writes or
      # edits: the allocation information, the usage totals and the namespace are
      # cross-examined against each other, and bucket generations against the
      # pointers that carry them. The kernel's driver mounts the volumes
      # read-write, and what it writes is read and edited here. Hard gate rather
      # than our own reader agreeing with our own writer.
      #
      # The package writes metadata version 1.3, which is what Ubuntu's
      # bcachefs-tools (1.3.4) writes and checks. CWB_REQUIRE_BCACHEFS and
      # CWB_REQUIRE_BCACHEFS_KERNEL turn a missing tool or driver into a failure
      # instead of a skip: on this runner both are expected, and a gate that
      # quietly skips when the image changes under it is no gate.
      - name: bcachefs oracle
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        env:
          CWB_REQUIRE_BCACHEFS: "1"
          CWB_REQUIRE_BCACHEFS_KERNEL: "1"
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "FullyQualifiedName~Compression.Tests.BcacheFs.BcacheFsBucketGenerationExternalTests|FullyQualifiedName~Compression.Tests.BcacheFs.BcacheFsExternalConformanceTests|FullyQualifiedName~Compression.Tests.BcacheFs.BcacheFsKernelMountTests"
          --logger "trx;LogFileName=bcachefs-oracle-tests.trx"

      # python-msgpack is the one oracle below that is not already on both runner images. Advisory
      # on its own: without it the MessagePack case skips and says so, and the rest still run.
      - name: Install structured-format oracles
        continue-on-error: true
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages msgpack \
            || python -m pip install --user msgpack \
            || true

      # The frozen vectors in the core tier pin bytes that CPython, Perl and reg.exe accepted once.
      # This asks the tools themselves, against live output, and it is a hard gate rather than
      # advisory because the tools it needs ship with both runner images: CPython with pickle, json
      # and ElementTree, Perl with Storable, and reg.exe on Windows. A red here means our output
      # stopped being readable by the implementation that owns the format.
      #
      # Individual cases still Assert.Ignore when their own tool is absent, so a runner without one
      # reports "not validated" for that case instead of failing the build for it. That is the only
      # thing a missing tool is allowed to do; a tool that IS there and rejects our bytes fails.
      - name: Structured pseudo-archive writer oracles
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "FullyQualifiedName~Compression.Tests.StructuredPseudoArchives.StructuredPseudoArchiveExternalToolTests"
          --logger "trx;LogFileName=structured-writer-tests.trx"

      # xfl2svg is the third-party XFL reader that judges the FLA reader and writer (Adobe Animate
      # cannot run on a runner). Pinned to the commit the captured reports were made with.
      - name: Install FLA oracle
        continue-on-error: true
        shell: bash
        run: |
          XFL2SVG="xfl2svg @ https://codeload.github.com/PluieElectrique/xfl2svg/zip/33304eff3c06be6e4a0637b7dbee04b3e37a47b9"
          { python3 -m pip install --user --break-system-packages flit_core \
              && python3 -m pip install --user --break-system-packages --no-build-isolation "$XFL2SVG"; } \
            || { python -m pip install --user flit_core && python -m pip install --user --no-build-isolation "$XFL2SVG"; } \
            || true

      # A hard gate like the structured oracles: xfl2svg must read Flash's own files and ours as the
      # same document. Without xfl2svg the cases Assert.Ignore and say so; a reader that is there
      # and disagrees fails the build.
      - name: FLA xfl2svg oracle
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "FullyQualifiedName~Compression.Tests.Fla.FlaXfl2SvgOracleTests"
          --logger "trx;LogFileName=fla-oracle-tests.trx"

      - name: End-to-end interop tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=EndToEnd"
          --logger "trx;LogFileName=e2e-tests.trx"

      # These exercise our formats against the real external tools installed
      # above (7-Zip, zstd, lz4, flac) and the post-mutation filesystem checks.
      # They were excluded from the core filter but had no step of their own, so
      # nothing ran them at all; advisory like the other interop tiers, because a
      # runner without one of the tools must not fail the build.
      # The owning readers/writers of the legacy archive formats the external tier asks about:
      # arj (ARJ methods 1-4), unar (The Unarchiver: PackIt, DiskDoubler), lhasa (LHA) and bsdtar (XAR in every
      # encoding). Installed after the core gate so they only feed this advisory step.
      - name: Install legacy-archive oracles (Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: sudo apt-get install -y arj unar libarchive-tools lhasa

      - name: External interop tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=ExternalInterop"
          --logger "trx;LogFileName=external-tests.trx"

      # mkfs.*, 7z and friends. Advisory for the same reason the neighbours are: a runner without
      # one of the tools must not fail the build. These used to sit in the CORE tier, which runs
      # BEFORE the tools above are installed -- so they were reached with nothing to interoperate
      # with and skipped themselves, every run, invisibly.
      - name: External filesystem interop tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=ExternalFsInterop"
          --logger "trx;LogFileName=external-fs-tests.trx"

      - name: OS integration tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=OsIntegration"
          --logger "trx;LogFileName=os-tests.trx"

      # Polyglot tests verify our formats round-trip through other language
      # ecosystems. Tests skip individually if the language package isn't
      # available; never call `pip install` etc. from inside a test.
      - name: Install polyglot test dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          python3 -m pip install --user --break-system-packages py7zr zstandard brotli lz4 rarfile || true
          sudo cpanm --notest Archive::Zip IO::Compress::Lzma IO::Compress::Lzop || true
          gem install --user-install minitar rubyzip zstd-ruby || true
          npm install --prefix /tmp/polyglot-node adm-zip tar-stream || true
          echo "NODE_PATH=/tmp/polyglot-node/node_modules" >> $GITHUB_ENV

      - name: Polyglot interop tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=PolyglotInterop"
          --logger "trx;LogFileName=polyglot-tests.trx"

      # Wall-clock performance tests are advisory — a slow shared runner must not
      # fail the build on a timing assertion.
      - name: Performance tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=Performance"
          --logger "trx;LogFileName=perf-tests.trx"

      # AFTER every test leg, and it runs even when one of them failed. Ordered before them it
      # masks the suite completely: this step going red stopped the job, no test ran at all, and
      # the pull request looked merely blocked rather than failing. That is how twenty-five failing
      # tests once reached main. The tests are the primary signal and must always produce one.
      #
      # The package READMEs must follow the house template, and their API reference must still match
      # the assemblies just built. The template itself lives in RepositoryTemplate -- nothing about
      # it is copied into this repo.
      - name: Check package READMEs
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: Hawkynt/RepositoryTemplate/package-readme@v1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  # A text lint over README.md against the house convention — no build, no toolchain — so it
  # runs beside the rest rather than inside it and cannot mask them.
  repo-readme:
    name: repo README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Hawkynt/RepositoryTemplate/repo-readme@v1
        with:
          gui: true
