name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # release.yml calls this via `uses: ./.github/workflows/ci.yml` so tag
  # releases run the exact same test matrix as per-PR CI.
  workflow_call: {}

# Pushing three times to a branch used to queue three full matrices and run all of them. A newer
# pull-request run supersedes the older one; a push to main is not cancelled, because main wants a
# recorded result for every commit rather than only for the newest.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                          # version.pl needs full history

      # FileFormat.PngCrushAdapters has sibling-conditional ProjectReferences
      # to ..\..\PNGCrushCS\FileFormat.{Png,Apng,Jpeg,...}. Without the sibling
      # those types disappear and any test that imports them fails to compile.
      # Clone the sibling alongside CompressionWorkbench so the conditional
      # resolves to true and the full image-format surface is available on CI.
      - name: Clone PNGCrushCS sibling
        shell: bash
        run: git clone --depth 1 https://github.com/Hawkynt/PNGCrushCS.git "$GITHUB_WORKSPACE/../PNGCrushCS"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # MSBuild does not reliably propagate $(Configuration) across solution-tree
      # boundaries; without this pre-build the sibling builds to bin/Debug/net8.0/
      # and the publish step then can't find Release/net8.0/ during bundling.
      - name: Pre-build PNGCrushCS sibling (Release)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/../PNGCrushCS"
          REQUIRED="Compression.Core FileFormat.Core FileFormat.Bmp FileFormat.Apng \
                    FileFormat.Tiff FileFormat.BigTiff FileFormat.Mng FileFormat.Fli \
                    FileFormat.Dcx FileFormat.Icns FileFormat.Mpo FileFormat.Jpeg \
                    FileFormat.Png"
          # Sibling reorganised most format projects into a FileFormats/ subdir
          # but kept Compression.Core / FileFormat.Core at the root. Probe both
          # locations per project so the script tolerates the layout move; also
          # tolerate transient sibling-mid-refactor commits where a project is
          # missing entirely — FileFormat.PngCrushAdapters.csproj has a matching
          # SiblingPresent gate that falls back to an empty assembly.
          locate() {
            local proj="$1"
            if [ -f "$proj/$proj.csproj" ]; then echo "$proj"; return 0; fi
            if [ -f "FileFormats/$proj/$proj.csproj" ]; then echo "FileFormats/$proj"; return 0; fi
            return 1
          }
          MISSING=""
          for proj in $REQUIRED; do
            if ! locate "$proj" >/dev/null; then
              MISSING="$MISSING $proj"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::PNGCrushCS sibling incomplete (missing:$MISSING). Skipping pre-build; consumer csproj SiblingPresent gate handles the fallback."
            exit 0
          fi
          for proj in $REQUIRED; do
            dir="$(locate "$proj")"
            echo "::group::Building $proj ($dir)"
            dotnet build "$dir/$proj.csproj" --configuration Release --nologo
            echo "::endgroup::"
            test -f "$dir/bin/Release/net8.0/$proj.dll" || {
              echo "::error::Pre-build did not produce $dir/bin/Release/net8.0/$proj.dll"
              exit 1
            }
          done
          echo "All sibling Release DLLs verified."

      - name: Restore
        run: dotnet restore CompressionWorkbench.slnx

      - name: Build
        run: dotnet build CompressionWorkbench.slnx --configuration Release --no-restore

      # Verify the four NuGet meta-packages still pack on every PR / push.
      # This catches regressions in the bundling target (filter excludes for
      # Compression.Core / Registry, ProjectReference path resolution, etc.)
      # before they reach release / nightly. We don't push or upload — the
      # _build.yml workflow does the real packing and artifact upload for the
      # nightly / release workflows that consume them.
      #
      # NB: --no-build is intentionally omitted. The meta csprojs use a custom
      # `_AddBundledAssembliesToPackage` target with `DependsOnTargets="ResolveReferences"`
      # which the SDK refuses to invoke under --no-build (NETSDK1085). The
      # prior `dotnet build` step already produced up-to-date outputs so pack's
      # build phase no-ops.
      - name: Verify NuGet meta-packages pack
        if: matrix.os == 'ubuntu-latest'
        run: |
          rm -rf dist-nuget
          dotnet pack Compression.Core/Hawkynt.Compression.Core.csproj                 --configuration Release --output dist-nuget -p:Version=0.0.0-ci
          dotnet pack Hawkynt.FileFormats.Audio/Hawkynt.FileFormats.Audio.csproj             --configuration Release --output dist-nuget -p:Version=0.0.0-ci
          dotnet pack Hawkynt.FileFormats.Archives/Hawkynt.FileFormats.Archives.csproj       --configuration Release --output dist-nuget -p:Version=0.0.0-ci
          dotnet pack Hawkynt.FileFormats.FileSystems/Hawkynt.FileFormats.FileSystems.csproj --configuration Release --output dist-nuget -p:Version=0.0.0-ci
          ls -la dist-nuget/

      # The package READMEs must follow the house template, and their API reference must still match
      # the assemblies just built. The template itself lives in RepositoryTemplate -- nothing about
      # it is copied into this repo.
      - name: Check package READMEs
        if: matrix.os == 'ubuntu-latest'
        uses: Hawkynt/RepositoryTemplate/package-readme@v1

      # Core tests -- always run (no external tools required).
      - name: Core tests
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category!=EndToEnd&Category!=OsIntegration&Category!=ExternalInterop&Category!=PolyglotInterop&Category!=Performance"
          --logger "trx;LogFileName=core-tests.trx"

      # Interop tools for E2E tests.
      - name: Install interop tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full gzip bzip2 xz-utils zstd lz4 tar cpio genisoimage mtools qemu-utils

      - name: Install 7-Zip (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install 7zip -y

      - name: End-to-end interop tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=EndToEnd"
          --logger "trx;LogFileName=e2e-tests.trx"

      - name: OS integration tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=OsIntegration"
          --logger "trx;LogFileName=os-tests.trx"

      # Polyglot tests verify our formats round-trip through other language
      # ecosystems. Tests skip individually if the language package isn't
      # available; never call `pip install` etc. from inside a test.
      - name: Install polyglot test dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          python3 -m pip install --user --break-system-packages py7zr zstandard brotli lz4 rarfile || true
          sudo cpanm --notest Archive::Zip IO::Compress::Lzma IO::Compress::Lzop || true
          gem install --user-install minitar rubyzip zstd-ruby || true
          npm install --prefix /tmp/polyglot-node adm-zip tar-stream || true
          echo "NODE_PATH=/tmp/polyglot-node/node_modules" >> $GITHUB_ENV

      - name: Polyglot interop tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=PolyglotInterop"
          --logger "trx;LogFileName=polyglot-tests.trx"

      # Wall-clock performance tests are advisory — a slow shared runner must not
      # fail the build on a timing assertion.
      - name: Performance tests
        continue-on-error: true
        run: >
          dotnet test Compression.Tests
          --configuration Release --no-build
          --filter "Category=Performance"
          --logger "trx;LogFileName=perf-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone PNGCrushCS sibling
        shell: bash
        run: git clone --depth 1 https://github.com/Hawkynt/PNGCrushCS.git "$GITHUB_WORKSPACE/../PNGCrushCS"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Pre-build PNGCrushCS sibling (Release)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/../PNGCrushCS"
          REQUIRED="Compression.Core FileFormat.Core FileFormat.Bmp FileFormat.Apng \
                    FileFormat.Tiff FileFormat.BigTiff FileFormat.Mng FileFormat.Fli \
                    FileFormat.Dcx FileFormat.Icns FileFormat.Mpo FileFormat.Jpeg \
                    FileFormat.Png"
          # Sibling reorganised most format projects into a FileFormats/ subdir
          # but kept Compression.Core / FileFormat.Core at the root. Probe both
          # locations per project so the script tolerates the layout move; also
          # tolerate transient sibling-mid-refactor commits where a project is
          # missing entirely — FileFormat.PngCrushAdapters.csproj has a matching
          # SiblingPresent gate that falls back to an empty assembly.
          locate() {
            local proj="$1"
            if [ -f "$proj/$proj.csproj" ]; then echo "$proj"; return 0; fi
            if [ -f "FileFormats/$proj/$proj.csproj" ]; then echo "FileFormats/$proj"; return 0; fi
            return 1
          }
          MISSING=""
          for proj in $REQUIRED; do
            if ! locate "$proj" >/dev/null; then
              MISSING="$MISSING $proj"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::PNGCrushCS sibling incomplete (missing:$MISSING). Skipping pre-build; consumer csproj SiblingPresent gate handles the fallback."
            exit 0
          fi
          for proj in $REQUIRED; do
            dir="$(locate "$proj")"
            echo "::group::Building $proj ($dir)"
            dotnet build "$dir/$proj.csproj" --configuration Release --nologo
            echo "::endgroup::"
            test -f "$dir/bin/Release/net8.0/$proj.dll" || {
              echo "::error::Pre-build did not produce $dir/bin/Release/net8.0/$proj.dll"
              exit 1
            }
          done
          echo "All sibling Release DLLs verified."

      - name: Run tests with coverage
        run: >
          dotnet test Compression.Tests
          --configuration Release
          --filter "Category!=EndToEnd&Category!=OsIntegration&Category!=ExternalInterop&Category!=PolyglotInterop&Category!=Performance"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage/report -reporttypes:HtmlInline_AzurePipelines

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report
