name: BeeGFS XFS xattr integration

on:
  push:
    branches: [feat/beegfs-multistream]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beegfs-multistream
          fetch-depth: 0
      - name: Integrate mounted XFS xattrs
        shell: python
        run: |
          from pathlib import Path

          attrs_path = Path('Hawkynt.FileFormats.FileSystems/FileSystems/FileSystem.Xfs/XfsExtendedAttributes.cs')
          text = attrs_path.read_text(encoding='utf-8')
          marker = '''  /// <summary>\n  /// Creates or replaces a short-form xattr. If the resulting fork does not fit\n'''
          addition = '''  /// <summary>Reads short-form xattrs directly by native XFS inode number.</summary>\n  internal static IReadOnlyDictionary<string, byte[]> ReadByInode(Stream image, ulong inodeNumber) {\n    ArgumentNullException.ThrowIfNull(image);\n    if (inodeNumber == 0) throw new ArgumentOutOfRangeException(nameof(inodeNumber));\n    EnsureReadableSeekable(image);\n\n    var original = image.Position;\n    try {\n      var geometry = Geometry.Read(image);\n      var inode = ReadAt(image, geometry.InodeOffset(inodeNumber), geometry.InodeSize);\n      return ParseShortForm(inode, geometry).ToDictionary(\n        attribute => ExpandName(attribute.Flags, attribute.Name),\n        attribute => attribute.Value,\n        StringComparer.Ordinal);\n    } finally {\n      image.Position = original;\n    }\n  }\n\n'''
          if marker not in text:
            raise SystemExit('XFS xattr insertion marker not found')
          attrs_path.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          session_path = Path('Hawkynt.FileFormats.FileSystems/FileSystems/FileSystem.Xfs/XfsFilesystemDriverAdapter.cs')
          text = session_path.read_text(encoding='utf-8')
          old = 'internal sealed class XfsReadOnlyFilesystemSession : IFilesystemSession {'
          new = 'internal sealed class XfsReadOnlyFilesystemSession : IFilesystemSession, IFilesystemExtendedAttributeReader {'
          if old not in text:
            raise SystemExit('XFS session declaration marker not found')
          text = text.replace(old, new, 1)
          marker = '''  public IFilesystemFileHandle OpenFile(FilesystemNodeId nodeId, FileAccess access) => _namespace.OpenFile(nodeId, access);\n'''
          addition = '''  public IReadOnlyDictionary<string, byte[]> ReadExtendedAttributes(FilesystemNodeId nodeId) {\n    _ = _namespace.Stat(nodeId); // validates both inode number and generation\n    lock (_ioGate)\n      return XfsExtendedAttributes.ReadByInode(_image, nodeId.Value);\n  }\n'''
          if marker not in text:
            raise SystemExit('XFS session method marker not found')
          session_path.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')

          test_path = Path('Compression.Tests/Xfs/XfsExtendedAttributesTests.cs')
          text = test_path.read_text(encoding='utf-8')
          if not text.startswith('using FileSystem.Xfs;'):
            raise SystemExit('unexpected XFS test header')
          text = text.replace('using FileSystem.Xfs;\n', 'using Compression.Registry;\nusing FileSystem.Xfs;\n', 1)
          marker = '''  [Test, Category("ErrorHandling")]\n  public void OversizedShortFormSet_FailsWithoutChangingExistingAttribute() {'''
          addition = '''  [Test, Category("RoundTrip")]\n  public void MountedSession_ExposesXattrsByStableNodeId() {\n    using var image = BuildImage();\n    var beeGfsMetadata = Enumerable.Range(0, 24).Select(i => (byte)(0xB0 + i)).ToArray();\n    XfsExtendedAttributes.Set(image, "brick/data.txt", "user.fhgfs", beeGfsMetadata);\n    image.Position = 0;\n\n    var adapter = new XfsFilesystemDriverAdapter();\n    using var session = adapter.OpenFilesystem(\n      image, new FilesystemOpenOptions(ReadOnly: true, LeaveOpen: true));\n    var xattrs = session as IFilesystemExtendedAttributeReader;\n    var brick = session.Lookup(session.RootNodeId, "brick");\n    var data = brick is { } brickId ? session.Lookup(brickId, "data.txt") : null;\n\n    Assert.Multiple(() => {\n      Assert.That(xattrs, Is.Not.Null,\n        "The mounted XFS session must surface native xattrs without a format-specific cast.");\n      Assert.That(brick, Is.Not.Null);\n      Assert.That(data, Is.Not.Null);\n    });\n\n    var attributes = xattrs!.ReadExtendedAttributes(data!.Value);\n    Assert.That(attributes["user.fhgfs"], Is.EqualTo(beeGfsMetadata));\n  }\n\n'''
          if marker not in text:
            raise SystemExit('XFS test insertion marker not found')
          test_path.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')
      - name: Commit integration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/beegfs-xfs-xattr-integrate.yml
          git add \
            Hawkynt.FileFormats.FileSystems/FileSystems/FileSystem.Xfs/XfsExtendedAttributes.cs \
            Hawkynt.FileFormats.FileSystems/FileSystems/FileSystem.Xfs/XfsFilesystemDriverAdapter.cs \
            Compression.Tests/Xfs/XfsExtendedAttributesTests.cs
          git diff --cached --check
          git commit -m '+ expose mounted XFS extended attributes'
          git push origin HEAD:feat/beegfs-multistream
