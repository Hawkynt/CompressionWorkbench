name: Merge readiness one-shot

on:
  push:
    branches:
      - feat/filesystem-rw-gaps

permissions:
  contents: write

concurrency:
  group: merge-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/filesystem-rw-gaps
          fetch-depth: 0
      - name: Apply merge-readiness fixes
        run: |
          python .github/merge-readiness.py
          python .github/optimizer-wire.py
          python .github/cli-purge-fix.py
          python .github/modify-consistency.py
          python .github/readme-capabilities.py
          python .github/coverage-matrix.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview
      - name: Clone optional sibling dependency
        run: git clone --depth 1 https://github.com/Hawkynt/PNGCrushCS.git ../PNGCrushCS || true
      - name: Build tests
        run: dotnet build Compression.Tests/Compression.Tests.csproj -c Release
      - name: Run maintenance and driver safety tests
        run: >-
          dotnet test Compression.Tests/Compression.Tests.csproj -c Release --no-build
          --filter "FullyQualifiedName~MarkerInterfaceCoverageTests|FullyQualifiedName~GenericPurgeRoundTripTests|FullyQualifiedName~FilesystemRwPromotionRoundTripTests|FullyQualifiedName~FilesystemDriver|FullyQualifiedName~MountNamespaceResolverTests|FullyQualifiedName~Btrfs|FullyQualifiedName~Zfs"
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete mutable maintenance surfaces"
          git push origin HEAD:feat/filesystem-rw-gaps
