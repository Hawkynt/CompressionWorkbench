name: MDF docs regeneration

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update generated MDF row
        shell: python
        run: |
          from pathlib import Path

          path = Path("Hawkynt.FileFormats.FileSystems/README.md")
          text = path.read_text(encoding="utf-8")
          old = "| [MDF/MDS](https://en.wikipedia.org/wiki/Alcohol_120%25) | `Mdf` | R/W | — | — | — | — | — | ✅ | own reader + struct-parity tests | Sector-image editor | [Alcohol 120%](https://en.wikipedia.org/wiki/Alcohol_120%25) |"
          new = "| [MDF/MDS](https://en.wikipedia.org/wiki/Alcohol_120%25) | `Mdf` | R/W | ✅ | ✅ rebuild | ✅ | — | — | ✅ | own reader + struct-parity tests | Fixed-track ISO 9660 editor; raw-sector EDC/ECC regenerated | [Alcohol 120%](https://en.wikipedia.org/wiki/Alcohol_120%25) |"
          if old not in text:
              raise SystemExit("expected MDF support-matrix row not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit generated documentation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Hawkynt.FileFormats.FileSystems/README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.FileSystems/README.md
          git commit -m "Update MDF support matrix"
          git push origin HEAD:${{ github.head_ref }}
