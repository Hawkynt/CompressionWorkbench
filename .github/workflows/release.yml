name: Release

# Stable release — MANUAL dispatch only. Invokes ci.yml explicitly, computes the
# single coordinated version (version.pl, from Directory.Build.props + commit
# count), publishes, and tags v<version>.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you cutting this release? (optional, for the audit log)'
        required: false

permissions:
  contents: write

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          V=$(perl .github/workflows/scripts/version.pl)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

  build:
    needs: version
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release-kind: release
      changelog-flag: --release v${{ needs.version.outputs.version }}

  publish:
    # Also waits on publish-nuget: a release tagged v<version> whose packages never reached
    # nuget.org is a release in name only. Without this dependency a failed or rejected push
    # still produced a green GitHub release, because publish ran in parallel with the push.
    needs: [version, build, publish-nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      # Notes = a short curated header + the commit-prefix changelog (+ - * # !),
      # NOT GitHub's PR-based "What's Changed".
      - name: Compose release notes
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          node .github/workflows/scripts/update-changelog.mjs --release "v$V" --notes CHANGES.md
          echo "## CompressionWorkbench v$V" > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<'EOF'

          Self-contained **Windows UI**, **Windows CLI** (`cwb.exe`) and **Linux CLI**
          (`cwb`) builds, plus the version-locked `Hawkynt.*` NuGet packages
          (Compression.Core / FileFormats.Audio / Archives / FileSystems).
          EOF
          echo >> RELEASE_NOTES.md
          cat CHANGES.md >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: dist/*.zip
          body_path: RELEASE_NOTES.md

  publish-nuget:
    name: Publish NuGet
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Lets the job mint the short-lived OIDC token that nuget.org's Trusted Publishing exchanges
      # for a one-hour API key. Without this the login step below cannot mint a token at all, and
      # the push falls back to the stored NUGET_TOKEN.
      id-token: write
    steps:
      # The .nupkg files were packed inside `_build.yml` and uploaded as the
      # `nuget-packages-<version>` artifact. We just download + push here.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.nuget-artifact-name }}
          path: dist-nuget

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish to NuGet.org (Trusted Publishing + acceptance check)
        uses: Hawkynt/RepositoryTemplate/nuget-publish@v1
        with:
          packages-path: dist-nuget
          user: ${{ secrets.NUGET_USER }}
          nuget-token: ${{ secrets.NUGET_TOKEN }}
