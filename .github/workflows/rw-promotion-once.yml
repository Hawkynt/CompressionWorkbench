name: R/W promotion one-shot

on:
  push:
    branches:
      - feat/filesystem-rw-gaps

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/filesystem-rw-gaps
      - name: Apply exact source patches
        run: python .github/rw-promotion.py
      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "+ promote rebuild-backed existing-image mutation to R/W"
          git push origin HEAD:feat/filesystem-rw-gaps
