name: Structured registry docs once

on:
  push:
    branches: [feat/structured-pseudo-archives]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: structured-registry-docs-once-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build archive package
        run: dotnet build Hawkynt.FileFormats.Archives/Hawkynt.FileFormats.Archives.csproj --configuration Release --nologo

      - name: Add structured and registry capability rows
        run: python .github/workflows/scripts/update-structured-registry-readme-once.py

      - name: Refresh archive package API documentation
        uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          mode: write
          project: Hawkynt.FileFormats.Archives/Hawkynt.FileFormats.Archives.csproj
          upload-artifact: false

      - uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: Hawkynt.FileFormats.Archives/README.md
          message: '* document structured and registry formats'

      - uses: Hawkynt/RepositoryTemplate/commit-generated-file@v1
        with:
          file: Hawkynt.FileFormats.Archives/REFERENCE.md
          message: '* refresh archive API reference'
