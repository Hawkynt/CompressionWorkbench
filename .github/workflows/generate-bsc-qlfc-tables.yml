name: Generate BSC QLFC tables

on:
  push:
    branches:
      - feature/bsc-optimizer
    paths:
      - .github/workflows/generate-bsc-qlfc-tables.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bsc-optimizer
      - name: Generate managed libbsc tables
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import re
          import struct
          import urllib.request

          commit = "baffa62c70b6ebbecc9af14ce550e965ea247680"
          url = f"https://raw.githubusercontent.com/IlyaGrebnov/libbsc/{commit}/libbsc/coder/common/tables.h"
          text = urllib.request.urlopen(url).read().decode("utf-8")

          def values(name, expected):
              match = re.search(rf"{name}\[[^]]+\]\s*=\s*\{{(.*?)\}};", text, re.S)
              if not match:
                  raise RuntimeError(f"missing {name}")
              result = [int(value) for value in re.findall(r"-?\d+", match.group(1))]
              if len(result) != expected:
                  raise RuntimeError(f"{name}: expected {expected}, got {len(result)}")
              return result

          stretch = values("bsc_stretch_table", 4097)
          squash = values("bsc_squash_table", 4097)
          rank_state = values("model_rank_state_table", 32768)
          run_state = values("model_run_state_table", 8192)

          def shorts(items):
              raw = b"".join(struct.pack("<h", value) for value in items)
              return base64.b64encode(raw).decode("ascii")

          def bytes_(items):
              return base64.b64encode(bytes(items)).decode("ascii")

          def literal(value):
              chunks = [value[i:i + 120] for i in range(0, len(value), 120)]
              return "\n      + ".join(f'"{chunk}"' for chunk in chunks)

          source = f'''// Generated from libbsc coder/common/tables.h at {commit} (Apache-2.0).
          // Copyright (c) 2009-2024 Ilya Grebnov <ilya.grebnov@gmail.com>
          // See THIRD-PARTY-NOTICE.libbsc.txt in this directory.
          using System.Buffers.Binary;

          namespace FileFormat.Bsc;

          internal static class BscQlfcTables {{
            internal static readonly short[] Stretch = DecodeShorts(
                {literal(shorts(stretch))});

            internal static readonly short[] Squash = DecodeShorts(
                {literal(shorts(squash))});

            internal static readonly byte[] RankState = Convert.FromBase64String(
                {literal(bytes_(rank_state))});

            internal static readonly byte[] RunState = Convert.FromBase64String(
                {literal(bytes_(run_state))});

            internal static int RankStateFor(int contextRank4, int contextRun, int rankSizeHistory)
              => RankState[(contextRun << 11) | (contextRank4 << 3) | rankSizeHistory];

            internal static int RunStateFor(int contextRank0, int contextRun, int rank, int runSizeHistory)
              => RunState[(contextRank0 << 10) | (contextRun << 6) | (Math.Min(rank, 7) << 3) | Math.Min(runSizeHistory, 7)];

            internal static int StretchProbability(int probability) => Stretch[probability];

            internal static int SquashProbability(int stretched) => Squash[2048 + stretched];

            private static short[] DecodeShorts(string encoded) {{
              var bytes = Convert.FromBase64String(encoded);
              if ((bytes.Length & 1) != 0)
                throw new InvalidDataException("BSC: invalid generated QLFC short table");
              var result = new short[bytes.Length / sizeof(short)];
              for (var i = 0; i < result.Length; ++i)
                result[i] = BinaryPrimitives.ReadInt16LittleEndian(bytes.AsSpan(i * sizeof(short), sizeof(short)));
              return result;
            }}
          }}
          '''
          source = "\n".join(line[10:] if line.startswith("          ") else line for line in source.splitlines()) + "\n"
          pathlib.Path("FileFormats/FileFormat.Bsc/BscQlfcTables.cs").write_text(source, encoding="utf-8", newline="\n")
          PY
      - name: Commit generated table data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FileFormats/FileFormat.Bsc/BscQlfcTables.cs
          git diff --cached --quiet && exit 0
          git commit -m "Add libbsc QLFC model tables"
          git push origin HEAD:feature/bsc-optimizer
