name: Refresh NRG support matrix

on:
  push:
    branches: [fix/nrg-rw-maintenance]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh NRG support row and remove this one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path("Hawkynt.FileFormats.FileSystems/README.md")
          text = path.read_text(encoding="utf-8")
          old = "| [NRG](https://en.wikipedia.org/wiki/Nero_Burning_ROM) | `Nrg` | R/W | — | — | — | — | — | ✅ | own reader + struct-parity tests | Sector-image editor | [Nero Burning ROM](https://en.wikipedia.org/wiki/Nero_Burning_ROM) |"
          new = "| [NRG](https://en.wikipedia.org/wiki/Nero_Burning_ROM) | `Nrg` | R/W | ✅ | ✅ rebuild | — | ✅ | — | ✅ | own reader + struct-parity tests | NRG v1/v2 reader; v2 TAO writer; named edits rebuild the embedded ISO | [Nero Burning ROM](https://en.wikipedia.org/wiki/Nero_Burning_ROM) |"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one NRG support row, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/nrg-doc-fix.yml").unlink()
      - name: Commit support matrix refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh NRG support matrix"
          git push origin HEAD:"$GITHUB_REF_NAME"
