name: BeeGFS V6 fix

on:
  push:
    branches: [feat/beegfs-multistream]

permissions:
  actions: write
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beegfs-multistream
          fetch-depth: 0

      - name: Apply source and test fixes
        run: python3 .github/scripts/beegfs-v6-fix.py

      - name: Commit fixes and remove helpers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/beegfs-v6-fix.yml .github/scripts/beegfs-v6-fix.py
          git add Hawkynt.FileFormats.FileSystems/FileSystems/FileSystem.BeeGfs/BeeGfsMetadataCodec.cs Compression.Tests/BeeGfs/BeeGfsMetadataCodecTests.cs
          git diff --cached --check
          git commit -m '* fix BeeGFS V6 inode alignment'
          git push origin HEAD:feat/beegfs-multistream
          gh workflow run ci.yml --ref feat/beegfs-multistream
