name: NRG reader source fix

on:
  push:
    branches:
      - feature/nrg-track-reader

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nrg-track-reader
          fetch-depth: 0
      - name: Patch reader
        shell: python
        run: |
          from pathlib import Path

          path = Path('Hawkynt.FileFormats.FileSystems/FileFormats/FileFormat.Nrg/NrgReader.cs')
          text = path.read_text(encoding='utf-8')
          old = '''  private static bool TryNormalizeIsoLba(NrgTrackInfo track, int isoLba, out int relativeLba) {
            relativeLba = 0;
            if (isoLba < 0 || track.SectorSize <= 0)
              return false;

            var sectorCount = track.StoredLength / track.SectorSize;
            if (isoLba < sectorCount) {
              relativeLba = isoLba;
              return true;
            }

            if (track.Index1Lba is not { } baseLba || isoLba < baseLba)
              return false;
            var relative = (long)isoLba - baseLba;
            if (relative < 0 || relative >= sectorCount || relative > int.MaxValue)
              return false;
            relativeLba = (int)relative;
            return true;
          }
'''.replace('          ', '')
          new = '''  private static bool TryNormalizeIsoLba(NrgTrackInfo track, int isoLba, out int relativeLba) {
            relativeLba = 0;
            if (isoLba < 0 || track.SectorSize <= 0)
              return false;

            var sectorCount = track.StoredLength / track.SectorSize;
            if (track.Index1Lba is { } baseLba && baseLba > 0 && isoLba >= baseLba) {
              var absoluteRelative = (long)isoLba - baseLba;
              if (absoluteRelative >= 0 && absoluteRelative < sectorCount && absoluteRelative <= int.MaxValue) {
                relativeLba = (int)absoluteRelative;
                return true;
              }
            }

            if (isoLba >= sectorCount)
              return false;
            relativeLba = isoLba;
            return true;
          }
'''.replace('          ', '')
          if old not in text:
            raise SystemExit('TryNormalizeIsoLba body not found')
          text = text.replace(old, new, 1)
          text = text.replace('          pendingCue);', '          cue: pendingCue);', 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/nrg-reader-source-fix.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.FileSystems/FileFormats/FileFormat.Nrg/NrgReader.cs .github/workflows/nrg-reader-source-fix.yml
          git commit -m "Fix NRG multisession absolute LBA resolution"
          git push origin HEAD:feature/nrg-track-reader
