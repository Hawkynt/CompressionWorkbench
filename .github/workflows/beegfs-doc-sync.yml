name: BeeGFS package docs sync

on:
  push:
    branches: [feat/beegfs-multistream]

permissions:
  actions: write
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beegfs-multistream
          fetch-depth: 0

      - name: Download authoritative generated package docs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34949449675 -n package-readmes -D /tmp/package-readmes

      - name: Sync FileSystems package docs
        run: python3 .github/scripts/beegfs-doc-sync.py

      - name: Commit docs and remove helpers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/beegfs-doc-sync.yml .github/scripts/beegfs-doc-sync.py
          git add Hawkynt.FileFormats.FileSystems/README.md Hawkynt.FileFormats.FileSystems/REFERENCE.md
          git diff --cached --check
          git commit -m '* sync BeeGFS package documentation'
          git push origin HEAD:feat/beegfs-multistream
          gh workflow run ci.yml --ref feat/beegfs-multistream
