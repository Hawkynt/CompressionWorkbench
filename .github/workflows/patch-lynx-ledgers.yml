name: Patch Lynx ledgers

on:
  push:
    branches:
      - feature/commodore-lynx-maintenance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/commodore-lynx-maintenance

      - name: Update generated capability rows
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("Hawkynt.FileFormats.Archives/README.md"): (
                  "| Lynx (Commodore) | `Lynx` | `.lnx` | R/W | ✅ | defrag · wipe | Stored entries only | [Archive Team](http://fileformats.archiveteam.org/wiki/Lynx_(Commodore_64)) |",
                  "| Lynx (Commodore) | `Lynx` | `.lnx` | R/W | ✅ | defrag · shrink · wipe | Stored entries only | [Archive Team](http://fileformats.archiveteam.org/wiki/Lynx_(Commodore_64)) |",
              ),
              Path("Hawkynt.FileFormats.FileSystems/README.md"): (
                  "| [Commodore Lynx archive](https://en.wikipedia.org/wiki/Commodore_64) | `Lynx` | R/W | ✅ | ✅ rebuild | ✅ | — | — | ✅ | own reader + struct-parity tests | C64 Lynx archive | [Lynx](https://ist.uwaterloo.ca/~schepers/formats/LNX.TXT) |",
                  "| [Commodore Lynx archive](https://en.wikipedia.org/wiki/Commodore_64) | `Lynx` | R/W | ✅ | ✅ rebuild | ✅ | ✅ | — | ✅ | own reader + struct-parity tests | C64 Lynx archive | [Lynx](https://ist.uwaterloo.ca/~schepers/formats/LNX.TXT) |",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one current Lynx row in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

      - name: Commit capability ledgers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hawkynt.FileFormats.Archives/README.md Hawkynt.FileFormats.FileSystems/README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update Lynx capability ledgers"
          git push origin HEAD:feature/commodore-lynx-maintenance
