name: Fix ext allocated arithmetic one-shot

on:
  push:
    branches:
      - feat/filesystem-rw-gaps

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/filesystem-rw-gaps
      - name: Fix checked unsigned arithmetic
        shell: python
        run: |
          from pathlib import Path
          path = Path('FileSystems/FileSystem.Ext/ExtFilesystemDriverAdapter.cs')
          text = path.read_text()
          old = '    var allocated = checked((long)(((ulong)blocksHi << 32) | blocksLo) * 512UL);'
          new = '    var allocated = checked((long)(checked((((ulong)blocksHi << 32) | blocksLo) * 512UL)));'
          if old not in text:
              raise SystemExit('expected ext allocated expression not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-ext-allocated-once.yml').unlink()
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FileSystems/FileSystem.Ext/ExtFilesystemDriverAdapter.cs .github/workflows/fix-ext-allocated-once.yml
          git commit -m "fix: correct ext allocated byte arithmetic"
          git push origin HEAD:feat/filesystem-rw-gaps
