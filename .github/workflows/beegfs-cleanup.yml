name: BeeGFS cleanup

on:
  push:
    branches: [fix/beegfs-stream-contract]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beegfs-stream-contract
      - name: Restore unrelated Xenix proof detail
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Hawkynt.FileFormats.FileSystems/README.md')
          text = p.read_text()
          old = '| [Xenix FS](https://en.wikipedia.org/wiki/Xenix) | `Xenix` | R/W | ✅ | ✅ moving | ✅ | ✅ | ✅ | ✅ | host-kernel `sysv` mount reads byte-exact | — | [sysv](https://www.kernel.org/doc/html/latest/filesystems/sysv-fs.html) |'
          new = '| [Xenix FS](https://en.wikipedia.org/wiki/Xenix) | `Xenix` | R/W | ✅ | ✅ moving | ✅ | ✅ | ✅ | ✅ | host-kernel `sysv` (`detect_xenix`) mount reads byte-exact | — | [sysv](https://www.kernel.org/doc/html/latest/filesystems/sysv-fs.html) |'
          if old not in text:
              raise SystemExit('expected Xenix row not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.FileSystems/README.md
          git commit -m '* restore unrelated Xenix proof detail'
          git push origin HEAD:fix/beegfs-stream-contract
