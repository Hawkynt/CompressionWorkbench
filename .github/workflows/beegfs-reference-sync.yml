name: BeeGFS reference sync

on:
  push:
    branches: [fix/beegfs-stream-contract]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beegfs-stream-contract

      - name: Download generated package-readme artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10186360631/zip" \
            --output /tmp/package-readmes.zip
          rm -rf /tmp/package-readmes
          mkdir -p /tmp/package-readmes
          unzip -q /tmp/package-readmes.zip -d /tmp/package-readmes
          cp /tmp/package-readmes/Hawkynt.FileFormats.FileSystems/README.md Hawkynt.FileFormats.FileSystems/README.md
          cp /tmp/package-readmes/Hawkynt.FileFormats.FileSystems/REFERENCE.md Hawkynt.FileFormats.FileSystems/REFERENCE.md

      - name: Commit generated reference
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Hawkynt.FileFormats.FileSystems/README.md Hawkynt.FileFormats.FileSystems/REFERENCE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '* regenerate filesystem package reference'
          git push origin HEAD:fix/beegfs-stream-contract
