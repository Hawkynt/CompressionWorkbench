name: NSS package reference refresh

on:
  push:
    branches: [nss-native-read-extract-2]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nss-native-read-extract-2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build filesystem package
        run: dotnet build Hawkynt.FileFormats.FileSystems/Hawkynt.FileFormats.FileSystems.csproj -c Release

      - name: Regenerate package reference
        uses: Hawkynt/RepositoryTemplate/package-readme@v1
        with:
          mode: write
          project: Hawkynt.FileFormats.FileSystems/Hawkynt.FileFormats.FileSystems.csproj
          upload-artifact: 'false'

      - name: Commit generated reference
        shell: bash
        run: |
          set -euo pipefail
          path=Hawkynt.FileFormats.FileSystems/REFERENCE.md
          if git diff --quiet -- "$path"; then
            echo "Reference already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$path"
          git commit -m '* refresh filesystem package API reference'
          git push origin HEAD:nss-native-read-extract-2
