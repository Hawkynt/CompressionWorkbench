name: Vendor managed audio codec sources

on:
  push:
    branches:
      - feature/audio-adpcm-encoders

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audio-adpcm-encoders
          fetch-depth: 0

      - name: Vendor pinned managed codec sources
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/audio-codec-vendor"
          rm -rf "$work"
          mkdir -p "$work"

          git clone --quiet https://github.com/lostromb/concentus.git "$work/concentus"
          git -C "$work/concentus" checkout --quiet 3885c4e46513ef0fc81fca100189e54f1714c6ca

          git clone --quiet https://github.com/SteveLillis/.NET-Ogg-Vorbis-Encoder.git "$work/vorbis"
          git -C "$work/vorbis" checkout --quiet 9211018f92f09cff58bb0e98e3af322e83c48f3c

          git clone --quiet https://github.com/jongoochgithub/GroovyCodecs.git "$work/groovy"
          git -C "$work/groovy" checkout --quiet 007bb4fc160180ad0af2cf8b1566250677c801f1

          git clone --quiet https://github.com/PhrSite/SipLib.git "$work/siplib"
          git -C "$work/siplib" checkout --quiet 297c28be53f97b36e6acc73c56d7b1251b5b25f4

          rm -rf \
            Codecs/Codec.Opus/Vendored/Concentus \
            Codecs/Codec.Vorbis/Vendored/OggVorbisEncoder \
            Codecs/Codec.Mp3/Vendored/GroovyCodecs \
            Codecs/Codec.AmrWb/Vendored/AmrWbLib

          mkdir -p \
            Codecs/Codec.Opus/Vendored/Concentus \
            Codecs/Codec.Vorbis/Vendored/OggVorbisEncoder \
            Codecs/Codec.Mp3/Vendored/GroovyCodecs/Mp3 \
            Codecs/Codec.Mp3/Vendored/GroovyCodecs/Types \
            Codecs/Codec.AmrWb/Vendored/AmrWbLib

          # Concentus 2.2.2: pure managed Opus encoder/decoder source. The old-target-framework
          # System.Memory/Numerics package references are unnecessary on CompressionWorkbench.
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.cs' --exclude='*' \
            "$work/concentus/CSharp/Concentus/" Codecs/Codec.Opus/Vendored/Concentus/
          find Codecs/Codec.Opus/Vendored/Concentus -name AssemblyInfo.cs -delete
          cp "$work/concentus/LICENSE" Codecs/Codec.Opus/Vendored/Concentus/LICENSE.txt

          # OggVorbisEncoder: MIT managed libvorbis-style encoder.
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.cs' --exclude='*' \
            "$work/vorbis/OggVorbisEncoder/" Codecs/Codec.Vorbis/Vendored/OggVorbisEncoder/
          find Codecs/Codec.Vorbis/Vendored/OggVorbisEncoder -name AssemblyInfo.cs -delete
          cp "$work/vorbis/LICENSE" Codecs/Codec.Vorbis/Vendored/OggVorbisEncoder/LICENSE.txt

          # GroovyMp3 0.1.2: LGPL managed LAME/Jump3r port plus its in-repo Types dependency.
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.cs' --exclude='*' \
            "$work/groovy/Mp3/" Codecs/Codec.Mp3/Vendored/GroovyCodecs/Mp3/
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.cs' --exclude='*' \
            "$work/groovy/Types/" Codecs/Codec.Mp3/Vendored/GroovyCodecs/Types/
          find Codecs/Codec.Mp3/Vendored/GroovyCodecs -name AssemblyInfo.cs -delete
          cp "$work/groovy/LICENSE" Codecs/Codec.Mp3/Vendored/GroovyCodecs/LICENSE.txt

          # SipLib AMR-WB: managed 3GPP fixed-point implementation plus its small facade/interface.
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.cs' --exclude='*' \
            "$work/siplib/ClassLibrary/Media/AmrWb/" Codecs/Codec.AmrWb/Vendored/AmrWbLib/
          cp "$work/siplib/ClassLibrary/Media/AmrWbEncoder.cs" Codecs/Codec.AmrWb/Vendored/AmrWbLib/AmrWbEncoder.cs
          cp "$work/siplib/ClassLibrary/Media/IAudioEncoder.cs" Codecs/Codec.AmrWb/Vendored/AmrWbLib/IAudioEncoder.cs
          license_file="$(find "$work/siplib" -maxdepth 1 -type f \( -iname 'license' -o -iname 'license.*' \) | head -n1 || true)"
          if [[ -n "$license_file" ]]; then
            cp "$license_file" Codecs/Codec.AmrWb/Vendored/AmrWbLib/LICENSE.txt
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path: str, replacements: list[tuple[str, str]]) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old!r}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8', newline='\n')

          # Fix warnings/errors found by CI #815 while touching the encoder code.
          edit('Codecs/Codec.Aac/AacEncoder.cs', [
              ('_current = (byte)((_current << 1) | ((value >> i) & 1));',
               '_current = (byte)(((uint)_current << 1) | ((value >> i) & 1u));'),
          ])
          edit('Codecs/Codec.Flac/FlacCodec.Encode.cs', [
              ('_current = (byte)((_current << 1) | ((value >> bit) & 1));',
               '_current = (byte)(((ulong)_current << 1) | ((value >> bit) & 1UL));'),
          ])
          edit('Codecs/Codec.Ac3/Ac3Codec.Encode.cs', [
              ('groups[0] = (byte)Math.Min(groups[0], 15);',
               'groups[0] = (byte)Math.Min((int)groups[0], 15);'),
          ])
          edit('Codecs/Codec.AmrNb/AmrNbCodec.cs', [
              ('public static class AmrNbCodec {', 'public static partial class AmrNbCodec {'),
          ])
          edit('Codecs/Codec.MsAdpcm/MsAdpcmCodec.Encode.cs', [
              ('    for (var predictor = 0; predictor < AdaptCoeff1.Length; ++predictor) {',
               '    Span<int> candidates = stackalloc int[10];\n    for (var predictor = 0; predictor < AdaptCoeff1.Length; ++predictor) {'),
              ('\n      Span<int> candidates = stackalloc int[10];\n      candidates[0] = MinimumDelta;',
               '\n      candidates[0] = MinimumDelta;'),
          ])

          # The public surface keeps the repo-local OpusBandwidth enum; explicitly bridge it to the
          # vendored Concentus enum at the boundary instead of leaking the implementation type.
          opus = Path('Codecs/Codec.Opus/OpusCodec.Encode.cs')
          text = opus.read_text(encoding='utf-8-sig')
          text = text.replace('encoder.MaxBandwidth = options.MaxBandwidth.Value;',
                              'encoder.MaxBandwidth = (Concentus.Enums.OpusBandwidth)(int)options.MaxBandwidth.Value;')
          text = text.replace('encoder.Bandwidth = options.Bandwidth.Value;',
                              'encoder.Bandwidth = (Concentus.Enums.OpusBandwidth)(int)options.Bandwidth.Value;')
          opus.write_text(text, encoding='utf-8', newline='\n')

          # Remove codec NuGet dependencies. Vendored source is compiled directly by SDK globbing.
          projects = [
              'Codecs/Codec.Opus/Codec.Opus.csproj',
              'Codecs/Codec.Vorbis/Codec.Vorbis.csproj',
              'Codecs/Codec.Mp3/Codec.Mp3.csproj',
              'Codecs/Codec.AmrWb/Codec.AmrWb.csproj',
          ]
          names = ('Concentus', 'OggVorbisEncoder', 'GroovyMp3', 'SipLib')
          for project in projects:
              p = Path(project)
              text = p.read_text(encoding='utf-8-sig')
              # Remove only ItemGroups that actually contain one of the codec package references.
              def strip_group(match: re.Match[str]) -> str:
                  block = match.group(0)
                  return '' if any(f'Include="{name}"' in block for name in names) else block
              text = re.sub(r'\s*<ItemGroup>.*?</ItemGroup>', strip_group, text, flags=re.S)
              p.write_text(text.rstrip() + '\n', encoding='utf-8', newline='\n')

          # Keep vendored legacy code as source, but normalize line endings/tabs to this repository's
          # whitespace convention without changing algorithms or licensing notices.
          for root in [
              Path('Codecs/Codec.Opus/Vendored/Concentus'),
              Path('Codecs/Codec.Vorbis/Vendored/OggVorbisEncoder'),
              Path('Codecs/Codec.Mp3/Vendored/GroovyCodecs'),
              Path('Codecs/Codec.AmrWb/Vendored/AmrWbLib'),
          ]:
              for p in root.rglob('*.cs'):
                  text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
                  text = text.replace('\t', '  ')
                  p.write_text(text, encoding='utf-8', newline='\n')
          PY

          # This is deliberately a one-shot workflow. Delete it in the vendor commit so subsequent
          # pushes run only the repository's normal CI and cannot re-import sources.
          rm .github/workflows/vendor-audio-codecs.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Vendor managed audio codec sources and remove package dependencies'
          git push origin HEAD:feature/audio-adpcm-encoders
