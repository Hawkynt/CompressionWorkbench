name: Maintenance capability audit one-shot

on:
  push:
    branches:
      - feat/filesystem-rw-gaps

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  promote:
    if: github.event.head_commit.message == 'ci: run maintenance capability audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/filesystem-rw-gaps

      - name: Apply capability promotions and generate matrices
        run: python .github/maintenance-capabilities.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Clone PNGCrushCS sibling
        run: git clone --depth 1 https://github.com/Hawkynt/PNGCrushCS.git "$GITHUB_WORKSPACE/../PNGCrushCS"

      - name: Build test project
        run: dotnet build Compression.Tests/Compression.Tests.csproj -c Release

      - name: Run maintenance contract tests
        run: dotnet test Compression.Tests/Compression.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~MarkerInterfaceCoverageTests|FullyQualifiedName~WriteCapabilityHonestyTests"

      - name: Commit promoted capabilities
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "+ expose and promote maintenance capabilities"
          git push origin HEAD:feat/filesystem-rw-gaps
