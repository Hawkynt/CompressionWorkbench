name: Nightly

# Fires after CI passes on main/master. A red CI run never produces a nightly,
# so the "latest nightly" always points at tested code.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  meta:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      date:    ${{ steps.m.outputs.date }}
      version: ${{ steps.m.outputs.version }}
      tag:     ${{ steps.m.outputs.tag }}
      sha:     ${{ steps.m.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - id: m
        run: |
          DATE=$(date -u +%Y%m%d)
          VERSION=$(perl .github/workflows/scripts/version.pl)
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "date=$DATE"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$DATE"  >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"           >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      release-kind: nightly
      changelog-flag: --nightly --version ${{ needs.meta.outputs.version }}
      ref: ${{ needs.meta.outputs.sha }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Generate release notes (commit-prefix changelog)
        run: node .github/workflows/scripts/update-changelog.mjs --nightly --notes CHANGES.md

      - name: Delete same-date nightly if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.meta.outputs.tag }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "${{ needs.meta.outputs.tag }}" -R "${{ github.repository }}" --cleanup-tag --yes
          fi

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.meta.outputs.tag }}" \
              -R "${{ github.repository }}" \
              --title "Nightly ${{ needs.meta.outputs.date }} (${{ needs.meta.outputs.version }})" \
              --prerelease \
              --notes-file CHANGES.md \
              dist/*.zip

  publish-nuget:
    name: Publish NuGet
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      # The .nupkg files were packed inside `_build.yml` (shared with release.yml)
      # and uploaded as the `nuget-packages-<version>` artifact. We just download
      # + push here. Nightly versions are X.Y.Z.<build-count> with no prerelease
      # suffix, so they'll publish as a normal version on NuGet.org — that's what
      # the user asked for ("published as soon as nightly runs").
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.nuget-artifact-name }}
          path: dist-nuget

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Push to NuGet.org
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          if [ -z "$NUGET_TOKEN" ]; then
            echo "::warning::NUGET_TOKEN secret is not set; skipping publish."
            exit 0
          fi
          dotnet nuget push "dist-nuget/*.nupkg" \
            --api-key "$NUGET_TOKEN" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  prune:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GFS prune of old nightlies (7 daily + 4 weekly + 3 monthly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/scripts/prune-nightlies.mjs
