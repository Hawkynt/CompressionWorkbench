name: Nightly

# Fires after CI passes on main/master. A red CI run never produces a nightly,
# so the "latest nightly" always points at tested code.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      date:    ${{ steps.m.outputs.date }}
      version: ${{ steps.m.outputs.version }}
      tag:     ${{ steps.m.outputs.tag }}
      sha:     ${{ steps.m.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: m
        run: |
          DATE=$(date -u +%Y%m%d)
          VERSION=$(perl .github/workflows/scripts/version.pl)
          SHA="${{ github.sha }}"
          echo "date=$DATE"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$DATE"  >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"           >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      release-kind: nightly
      changelog-flag: --nightly --version ${{ needs.meta.outputs.version }}
      ref: ${{ needs.meta.outputs.sha }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Generate release notes (commit-prefix changelog)
        run: node .github/workflows/scripts/update-changelog.mjs --nightly --notes CHANGES.md

      - name: Delete same-date nightly if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ needs.meta.outputs.tag }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "${{ needs.meta.outputs.tag }}" -R "${{ github.repository }}" --cleanup-tag --yes
          fi

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.meta.outputs.tag }}" \
              -R "${{ github.repository }}" \
              --title "Nightly ${{ needs.meta.outputs.date }} (${{ needs.meta.outputs.version }})" \
              --prerelease \
              --notes-file CHANGES.md \
              dist/*.zip

  prune:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GFS prune of old nightlies (7 daily + 4 weekly + 3 monthly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/scripts/prune-nightlies.mjs
