name: Fill API summaries

on:
  push:
    branches: [docs/complete-api-summaries]

permissions:
  contents: write

jobs:
  fill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Fill missing source summaries
        run: |
          python3 .github/scripts/fill-api-summaries.py
          python3 .github/scripts/fix-residual-api-summaries.py
          python3 .github/scripts/patch-api-summary-ci.py

      - name: Build checksum package
        run: dotnet build Hawkynt.Algorithms.Checksums/Hawkynt.Algorithms.Checksums.csproj --configuration Release --nologo /warnaserror:CS1591

      - name: Build hashing package
        run: dotnet build Hawkynt.Algorithms.Hashing/Hawkynt.Algorithms.Hashing.csproj --configuration Release --nologo /warnaserror:CS1591

      - name: Regenerate package API references
        uses: Hawkynt/RepositoryTemplate/package-readme@b64e9f64cb808f7d0141eadff41c97e82925c14d
        with:
          mode: write
          project: |
            Hawkynt.Algorithms.Checksums/Hawkynt.Algorithms.Checksums.csproj
            Hawkynt.Algorithms.Hashing/Hawkynt.Algorithms.Hashing.csproj

      - name: Require summaries for every reference row
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for file in Hawkynt.Algorithms.Checksums/REFERENCE.md Hawkynt.Algorithms.Hashing/REFERENCE.md; do
            blank=$(grep -nE '\|[[:space:]]*\|$' "$file" || true)
            if [[ -n "$blank" ]]; then
              echo "::error file=$file::Public API reference contains blank summary cells"
              echo "$blank"
              failed=1
            else
              echo "$file: 0 blank summary rows"
            fi
          done
          test "$failed" -eq 0
          git diff --check

      - name: Commit generated documentation fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml Hawkynt.Algorithms.Checksums Hawkynt.Algorithms.Hashing
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m '# require complete public API summaries'
          git push
